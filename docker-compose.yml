name: relay-agents

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "127.0.0.1:55590:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6540:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: |
        {"interactiveLogin": false, "tokenCallbacks": [{"issuerId": "relay", "tokenExpiry": 3600, "requestMappings": [
            {"requestParam": "client_id", "match": "dev-asha", "claims": {"sub": "dev-asha", "tenant": "acme", "scope": "relay.read relay.write"}},
            {"requestParam": "client_id", "match": "lead-ravi", "claims": {"sub": "lead-ravi", "tenant": "acme", "scope": "relay.read relay.approve"}},
            {"requestParam": "client_id", "match": "dev-lena", "claims": {"sub": "dev-lena", "tenant": "globex", "scope": "relay.read relay.write"}}
        ]}]}
    ports:
      - "127.0.0.1:7791:8080"

  # Stands in for an internal orders API that the HTTP tool calls. demo.sh loads the stubs.
  orders-api:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:7792:8080"

  app:
    build: .
    image: relay-agents:local
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      oauth: { condition: service_started }
      orders-api: { condition: service_started }
    environment:
      RELAY_DB_URL: jdbc:postgresql://postgres:5432/relay
      RELAY_REDIS_HOST: redis
      RELAY_REDIS_PORT: 6379
      RELAY_KAFKA_BOOTSTRAP: kafka:9092
      RELAY_JWT_ISSUER: http://oauth:8080/relay
      RELAY_HTTP_TOOL_HOSTS: orders-api
      # Demo-only values; real deployments inject these from a secret store.
      RELAY_SECRET_ORDERS_API_TOKEN: demo-orders-token
      RELAY_SECRET_HOOK_SECRET: demo-hook-secret
      JAVA_TOOL_OPTIONS: -Xmx384m -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:7790:7790"
