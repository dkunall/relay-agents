name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, architecture and integration tests
        run: mvn -B -ntp verify
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  image:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t relay-agents:${{ github.sha }} .
      - name: Scan image
        # Pinned by commit: earlier trivy-action tags were hijacked in March 2026.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: relay-agents:${{ github.sha }}
          version: v0.69.3
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Compose smoke test
        run: |
          docker tag relay-agents:${{ github.sha }} relay-agents:local
          docker compose up -d --no-build --wait --wait-timeout 240
          ./scripts/demo.sh
      - name: Compose logs
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
