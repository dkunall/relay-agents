spring:
  application:
    name: relay-agents
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${RELAY_DB_URL:jdbc:postgresql://localhost:55590/relay}
    username: ${RELAY_DB_USER:relay}
    password: ${RELAY_DB_PASSWORD:relay}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${RELAY_REDIS_HOST:localhost}
      port: ${RELAY_REDIS_PORT:6540}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${RELAY_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RELAY_JWT_ISSUER:http://localhost:7791/relay}
  task:
    scheduling:
      pool:
        size: 4
  mvc:
    async:
      request-timeout: 15m

server:
  port: ${PORT:7790}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.1

relay:
  runs:
    lease: PT15S
    workers: 4
    poll-interval: PT0.2S
    approval-ttl: PT24H
    default-max-concurrent-runs: 20
    default-daily-cost-cap-micros: 5000000
  llm:
    cache-ttl: PT1H
    # Prices in micro-dollars per 1k tokens. The scripted price is made up so budgets have something to bite on.
    pricing:
      "[scripted/*]":
        input-per1k: 150
        output-per1k: 600
      "[openai/gpt-4o-mini]":
        input-per1k: 150
        output-per1k: 600
  tools:
    http:
      allowed-hosts: ${RELAY_HTTP_TOOL_HOSTS:}
      connect-timeout: PT2S
      max-response-bytes: 32768
    rate-limit:
      capacity: 20
      refill-per-second: 10
  rag:
    chunk-size: 800
    chunk-overlap: 100
  outbox:
    batch-size: 100
    retention: P7D
